<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MySolar — Warranty Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#006C9C; --blue-deep:#004A6B; --blue-night:#0A2B38; --tint:#EDF4F8;
  --green:#0F7B4F; --green-bg:#E4F4EC;
  --amber:#9A6410; --amber-bg:#FCF0DC;
  --red:#A32A20;  --red-bg:#FBE9E7;
  --grey:#5A6B74; --line:#D8E2E7; --ink:#12242D; --paper:#fff; --bg:#F5F8FA;
  --sans:'Public Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2;font-weight:700;letter-spacing:-.015em}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1rem}
a{color:var(--blue)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}

.demoflag{background:var(--blue-night);color:#F0B429;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:7px}
.topnav{background:var(--blue-night);color:#fff}
.topnav .in{max-width:1240px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:700;font-size:1.06rem;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#7FB4C8;font-weight:500}
.navbtns{display:flex;gap:8px;align-items:center}
.navbtns a,.navbtns button{color:#BBD8E4;text-decoration:none;font-size:.88rem;font-weight:600;padding:7px 13px;border-radius:4px;background:none;border:0;cursor:pointer}
.navbtns a:hover,.navbtns button:hover{background:rgba(255,255,255,.1);color:#fff}
.navbtns a.on{background:var(--blue);color:#fff}

.page{max-width:1240px;margin:0 auto;padding:26px 22px 60px}
.narrow{max-width:620px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:7px}
.card-pad{padding:22px}
label{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);margin-bottom:6px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:5px;font-family:var(--mono);font-size:.94rem;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--blue);outline:none}
select{font-family:var(--sans)}
.field{margin-bottom:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.row2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:5px;padding:11px 20px;font-size:.93rem;font-weight:600;cursor:pointer;text-decoration:none;transition:.14s}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-deep)}
.btn-p[disabled]{opacity:.6;cursor:wait}
.btn-s{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--blue);color:var(--blue)}
.btn-full{width:100%}
.err{background:var(--red-bg);color:var(--red);border:1px solid #F0C7C2;border-radius:5px;padding:11px 13px;font-size:.9rem;margin-bottom:14px}
.ok{background:var(--green-bg);color:var(--green);border:1px solid #BFE3D1;border-radius:5px;padding:11px 13px;font-size:.9rem;margin-bottom:14px}
.muted{color:var(--grey)} .tiny{font-size:.85rem}

.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:3px;white-space:nowrap}
.pill.g{background:var(--green-bg);color:var(--green)}
.pill.w{background:var(--tint);color:var(--blue-deep)}
.pill.x{background:var(--red-bg);color:var(--red)}
.pill.n{background:#EEF1F3;color:var(--grey)}
.pill.a{background:var(--amber-bg);color:var(--amber)}

.hero-c{background:linear-gradient(155deg,var(--blue) 0%,var(--blue-deep) 100%);color:#fff;padding:40px 22px 46px}
.hero-c .in{max-width:620px;margin:0 auto}
.hero-c h1{font-size:1.85rem;color:#fff}
.hero-c p{color:#C4E0EC;margin:10px 0 0}
.lookup-card{max-width:620px;margin:-30px auto 0;position:relative}
.result-hd{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.result-hd .model{font-size:1.25rem;font-weight:700}
.timeline{padding:20px 22px;border-bottom:1px solid var(--line)}
.bar{height:9px;background:#E6ECEF;border-radius:99px;overflow:hidden;margin:9px 0 7px;position:relative}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar .g{position:absolute;top:0;left:0;height:100%;background:var(--green);border-radius:99px;opacity:.85}
.barlbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;color:var(--grey);letter-spacing:.06em}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;margin:0;padding:20px 22px}
dl.kv dt{color:var(--grey);font-size:.89rem}
dl.kv dd{margin:0;font-family:var(--mono);font-size:.89rem;text-align:right}
.svc{padding:18px 22px;border-top:1px solid var(--line)}
.svc-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.svc-item:last-child{border-bottom:0}
.svc-item .d{font-family:var(--mono);font-size:.82rem;color:var(--grey);white-space:nowrap;min-width:92px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:780px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:15px 17px}
.stat b{display:block;font-size:1.7rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat span{font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;color:var(--grey)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.toolbar .field{margin:0}
.toolbar .grow{flex:1;min-width:210px}
table{width:100%;border-collapse:collapse;background:var(--paper)}
th{text-align:left;font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;color:var(--grey);font-weight:600;padding:11px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--tint)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
.src{font-family:var(--mono);font-size:.76rem;color:var(--grey)}
.empty{padding:44px 20px;text-align:center;color:var(--grey)}
.crumb{background:none;border:0;color:var(--blue);font-weight:600;font-size:.9rem;cursor:pointer;padding:0;margin-bottom:14px}
.detail-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr}}
.sec-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
.claim{padding:13px 18px;border-bottom:1px solid var(--line);font-size:.9rem}
.claim:last-child{border-bottom:0}
.badge{background:var(--amber);color:#3A2600;border-radius:99px;padding:1px 7px;font-size:.74rem;font-weight:700}
.fu{background:var(--paper);border:1px solid var(--line);border-radius:7px;margin-bottom:10px}
.fu-main{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.fu-name{font-weight:700;font-size:1.02rem;margin-top:7px}
.fu-acts{display:flex;gap:7px;flex-wrap:wrap}
.fu-panel{display:none;padding:15px 18px;border-top:1px solid var(--line);background:var(--tint)}
.fu-panel.show{display:block}
.fu-opts{display:flex;gap:7px;flex-wrap:wrap}
.spin{padding:50px 20px;text-align:center;color:var(--grey);font-family:var(--mono);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>

<div class="demoflag" id="flag">MySolar Warranty Registry</div>

<div class="topnav">
  <div class="in">
    <div class="brand">MySolar <span>Warranty Registry</span></div>
    <div class="navbtns" id="nav"></div>
  </div>
</div>

<div id="app"><div class="spin">Loading…</div></div>

<script>
/* ============================================================================
   PRODUCT DEFINITIONS
   Kept in the browser as well as the database so the coverage bar can be
   drawn without an extra round trip.
   ========================================================================== */
const MODELS = {
  "MY40-S3": { name:"MySolar MY40 Series 3", litres:180, gallons:40, pax:"Up to 4",
               guaranteeYears:3, warrantyYears:9, steel:"1.5mm AISI 304", tubes:10, panel:"21 sq ft" },
  "MY60-S1": { name:"MySolar MY60 Series 1", litres:276, gallons:60, pax:"4 to 6",
               guaranteeYears:1, warrantyYears:9, steel:"1.2mm AISI 304", tubes:14, panel:"42 sq ft" },
  "MY60-S3": { name:"MySolar MY60 Series 3", litres:276, gallons:60, pax:"6 to 8",
               guaranteeYears:3, warrantyYears:9, steel:"1.5mm AISI 304", tubes:20, panel:"42 sq ft" }
};

/* ============================================================================
   DATA LAYER — Supabase
   The anon key belongs in the browser. It is safe ONLY because Row Level
   Security is switched on. Never paste the service_role key here.
   ========================================================================== */
const SUPABASE_URL      = "https://kvyyubhveodjqbqxwjuz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2eXl1Ymh2ZW9kanFicXh3anV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDU5NDMsImV4cCI6MjEwMzMyMTk0M30.dLbHBTncz6UG4i9YhqpLe35dzJhPXZ3Xmpn5Ybd0qms";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function rowFromView(v, service = [], claims = []) {
  return {
    id: v.id, warrantyNo: v.warranty_no, serial: v.serial_no || "",
    model: v.model_code, name: v.customer_name, phone: v.customer_phone,
    email: v.customer_email || "", address: v.address || "", area: v.customer_area || "",
    installDate: v.install_date, channel: v.channel,
    dealer: v.dealer_name || "", installer: v.installer || "",
    service: service.map(s => ({ date:s.visit_date, type:s.visit_type,
                                 tech:s.technician || "", note:s.notes || "" })),
    claims:  claims.map(c => ({ date:c.raised_on, issue:c.issue,
                                status:c.status, resolution:c.resolution || "" }))
  };
}

const DataSource = {
  async listWarranties(){
    const { data: rows, error } = await sb.from("v_installations")
      .select("*").order("install_date", { ascending:false });
    if (error) throw error;
    const { data: open } = await sb.from("claims")
      .select("installation_id, raised_on, issue, status, resolution")
      .in("status", ["open","in_progress"]);
    const by = {};
    (open || []).forEach(c => { (by[c.installation_id] ||= []).push(c); });
    return rows.map(v => rowFromView(v, [], by[v.id] || []));
  },

  async getById(id){
    const { data: v, error } = await sb.from("v_installations")
      .select("*").eq("id", id).single();
    if (error || !v) return null;
    const [{ data: svc }, { data: cl }] = await Promise.all([
      sb.from("service_visits").select("*").eq("installation_id", id).order("visit_date"),
      sb.from("claims").select("*").eq("installation_id", id).order("raised_on")
    ]);
    return rowFromView(v, svc || [], cl || []);
  },

  async findForCustomer(warrantyNo, phone){
    const args = { p_warranty_no:String(warrantyNo).trim(), p_phone:String(phone).trim() };
    const { data, error } = await sb.rpc("lookup_warranty", args);
    if (error) throw error;
    if (!data || data.length === 0) return { ok:false, reason:"notfound" };
    const v = data[0];
    const { data: hist } = await sb.rpc("lookup_service_history", args);
    return { ok:true, row:{
      id:null, warrantyNo:v.warranty_no, serial:v.serial_no || "", model:v.model_code,
      name:v.customer_name, phone:"", email:"", address:"", area:"",
      installDate:v.install_date, channel:"", dealer:"", installer:"",
      service:(hist || []).map(s => ({ date:s.visit_date, type:s.visit_type, tech:"", note:s.notes || "" })),
      claims:[]
    }};
  },

  async createWarranty(p){
    const { data, error } = await sb.rpc("register_installation", {
      p_name:p.name, p_phone:p.phone, p_email:p.email || null,
      p_address:p.address || null, p_area:p.area || null,
      p_model_code:p.model, p_serial_no:p.serial || null,
      p_install_date:p.installDate, p_channel:p.channel,
      p_dealer_name:p.dealer || null, p_installer:p.installer || null
    });
    if (error) throw error;
    return await this.getById(data);
  },

  async addServiceVisit(id, visit){
    const { error } = await sb.from("service_visits").insert({
      installation_id:id, visit_date:visit.date, visit_type:visit.type,
      technician:visit.tech || null, notes:visit.note || null
    });
    if (error) throw error;
    return await this.getById(id);
  },

  /* --- follow-ups --------------------------------------------------- */
  async listFollowups(){
    const { data, error } = await sb.from("v_followups_open").select("*");
    if (error) throw error;
    return data || [];
  },

  async countFollowups(){
    const { count, error } = await sb.from("followups")
      .select("id", { count:"exact", head:true }).in("status", ["open","in_progress"]);
    if (error) return 0;
    return count || 0;
  },

  async generateFollowups(){
    const { data, error } = await sb.rpc("generate_followups");
    if (error) throw error;
    return data;
  },

  async completeFollowup(id, outcome, notes){
    const { error } = await sb.from("followups").update({
      status:"done", outcome, notes: notes || null,
      completed_at: new Date().toISOString()
    }).eq("id", id);
    if (error) throw error;
  },

  async snoozeFollowup(id, days){
    const d = new Date(); d.setDate(d.getDate() + days);
    const { error } = await sb.from("followups").update({
      status:"snoozed", snooze_until: d.toISOString().slice(0,10)
    }).eq("id", id);
    if (error) throw error;
  },

  async signIn(email, password){
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return { ok:false, message:error.message };
    return { ok:true, user:data.user };
  },
  async signOut(){ await sb.auth.signOut(); },
  async currentUser(){ const { data } = await sb.auth.getUser(); return data.user || null; }
};
/* ==================== END OF DATA LAYER ==================== */


/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const digits = s => String(s||"").replace(/\D/g,"");
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function waNumber(phone){
  let d = digits(phone);
  if(d.startsWith("60")) return d;
  if(d.startsWith("0"))  return "6" + d;          // 012-345 6789 -> 60123456789
  return "60" + d;
}
function addYears(iso,n){ const d=new Date(iso+"T00:00:00"); d.setFullYear(d.getFullYear()+n); return d; }
function fmt(d){ const dt=(typeof d==="string")?new Date(d+"T00:00:00"):d;
  return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

function coverage(row){
  const m = MODELS[row.model];
  const start = new Date(row.installDate+"T00:00:00");
  const gEnd = addYears(row.installDate, m.guaranteeYears);
  const wEnd = addYears(row.installDate, m.warrantyYears);
  const now = new Date();
  let state,label,cls;
  if(now<gEnd){ state="guarantee"; label="Under guarantee"; cls="g"; }
  else if(now<wEnd){ state="warranty"; label="Under tank warranty"; cls="w"; }
  else { state="expired"; label="Expired"; cls="x"; }
  const total = daysBetween(start,wEnd);
  const gone = Math.min(Math.max(daysBetween(start,now),0),total);
  return { state,label,cls,gEnd,wEnd,model:m,
    pctElapsed:Math.round(gone/total*100),
    pctGuarantee:Math.round(daysBetween(start,gEnd)/total*100),
    daysLeft:Math.max(daysBetween(now,wEnd),0) };
}
const pill = c => `<span class="pill ${c.cls}">${c.label}</span>`;

/* ---------- state ---------- */
let USER = null;
let FILTER = { q:"", status:"all", channel:"all" };
let FU_COUNT = 0;
const route = () => (location.hash || "#/check").split("?")[0];
window.addEventListener("hashchange", render);

function nav(){
  const r = route();
  $("#nav").innerHTML = `
    <a href="#/check" class="${r==="#/check"?"on":""}">Check a warranty</a>
    <a href="#/admin" class="${r.startsWith("#/admin")&&r!=="#/admin/followups"?"on":""}">Staff</a>
    ${USER ? `<a href="#/admin/followups" class="${r==="#/admin/followups"?"on":""}">Follow-ups${
        FU_COUNT ? ` <span class="badge">${FU_COUNT}</span>` : ""}</a>` : ""}
    ${USER ? `<button id="outBtn">Sign out</button>` : ""}`;
  const o = $("#outBtn");
  if(o) o.onclick = async () => { await DataSource.signOut(); USER=null; location.hash="#/check"; render(); };
}

/* ---------- customer ---------- */
function viewCheck(){
  return `
  <div class="hero-c"><div class="in">
    <h1>Check your MySolar warranty</h1>
    <p>Enter your warranty number and the phone number given when your system was installed.</p>
  </div></div>
  <div class="page"><div class="lookup-card card card-pad">
    <div id="lkErr"></div>
    <div class="field"><label for="wn">Warranty number</label>
      <input id="wn" placeholder="MYS-2022-0147" autocomplete="off"></div>
    <div class="field"><label for="pn">Phone number</label>
      <input id="pn" placeholder="012-345 6789" autocomplete="off"></div>
    <button class="btn btn-p btn-full" id="lkGo">Check my warranty</button>
    <p class="tiny muted" style="margin:14px 0 0">
      Your warranty number is on the plate at the end of the tank and on your
      installation slip. Can't find it? WhatsApp 012-318 0048 and we'll look it up.
    </p>
  </div>
  <div id="lkResult" style="max-width:620px;margin:18px auto 0"></div></div>`;
}

async function doLookup(){
  const btn = $("#lkGo"), box = $("#lkResult"), errBox = $("#lkErr");
  errBox.innerHTML = ""; box.innerHTML = "";
  if(!$("#wn").value.trim() || !$("#pn").value.trim()){
    errBox.innerHTML = `<div class="err">Please fill in both fields.</div>`; return;
  }
  btn.disabled = true; btn.textContent = "Checking…";
  try{
    const res = await DataSource.findForCustomer($("#wn").value, $("#pn").value);
    if(!res.ok){
      errBox.innerHTML = `<div class="err">${res.reason==="notfound"
        ? "We couldn't find that warranty number. Please check it and try again."
        : "That phone number doesn't match this warranty."}</div>`;
    } else box.innerHTML = customerCard(res.row);
  }catch(e){
    errBox.innerHTML = `<div class="err">Couldn't reach the server. Please try again.<br><span class="tiny mono">${esc(e.message||e)}</span></div>`;
  }
  btn.disabled = false; btn.textContent = "Check my warranty";
}

function customerCard(row){
  const c = coverage(row);
  const svc = row.service.length
    ? row.service.slice().reverse().map(s =>
        `<div class="svc-item"><span class="d">${fmt(s.date)}</span><span>${esc(s.type)} — ${esc(s.note)}</span></div>`).join("")
    : `<p class="tiny muted" style="margin:0">No service visits recorded yet.</p>`;
  return `<div class="card">
    <div class="result-hd">
      <div><div class="model">${esc(c.model.name)}</div>
        <div class="tiny muted mono">${esc(row.warrantyNo)}</div></div>
      ${pill(c)}
    </div>
    <div class="timeline">
      <div class="tiny muted">Coverage from ${fmt(row.installDate)}</div>
      <div class="bar"><span class="g" style="width:${c.pctGuarantee}%"></span>
        <i style="width:${c.pctElapsed}%;opacity:.55"></i></div>
      <div class="barlbl"><span>Installed</span><span>${c.state==="expired"
        ? "Warranty ended "+fmt(c.wEnd) : c.daysLeft+" days remaining"}</span></div>
    </div>
    <dl class="kv">
      <dt>Registered to</dt><dd>${esc(row.name)}</dd>
      <dt>Capacity</dt><dd>${c.model.litres} L · ${c.model.gallons} gal</dd>
      <dt>Serial number</dt><dd>${esc(row.serial||"—")}</dd>
      <dt>Installed</dt><dd>${fmt(row.installDate)}</dd>
      <dt>Guarantee (${c.model.guaranteeYears} yr)</dt><dd>${fmt(c.gEnd)}</dd>
      <dt>Tank warranty (${c.model.warrantyYears} yr)</dt><dd>${fmt(c.wEnd)}</dd>
    </dl>
    <div class="svc"><h3 style="margin-bottom:9px">Service history</h3>${svc}</div>
    <div class="card-pad" style="border-top:1px solid var(--line)">
      <a class="btn btn-p btn-full" target="_blank" rel="noopener"
        href="https://wa.me/60123180048?text=${encodeURIComponent("Hi MySolar, I'd like to ask about warranty "+row.warrantyNo+".")}">
        WhatsApp us about this system</a>
    </div></div>`;
}

    <h2>Staff sign in</h2>

/* ---------- registry ---------- */
async function viewList(){
  const rows = await DataSource.listWarranties();
  const wc = rows.map(r => ({ r, c:coverage(r) }));
  const counts = {
    total: wc.length,
    guarantee: wc.filter(x=>x.c.state==="guarantee").length,
    warranty:  wc.filter(x=>x.c.state==="warranty").length,
    openClaims:wc.filter(x=>x.r.claims.some(c=>c.status==="open"||c.status==="in_progress")).length
  };
  const q = FILTER.q.toLowerCase();
  const shown = wc.filter(({r,c}) => {
    if(FILTER.status!=="all" && c.state!==FILTER.status) return false;
    if(FILTER.channel!=="all" && r.channel!==FILTER.channel) return false;
    if(!q) return true;
    return [r.warrantyNo,r.serial,r.name,r.phone,r.area,r.dealer].join(" ").toLowerCase().includes(q);
  });

  const body = shown.length ? shown.map(({r,c}) => `
    <tr data-id="${r.id}">
      <td class="mono">${esc(r.warrantyNo)}</td>
      <td><b>${esc(r.name)}</b><div class="src">${esc(r.area||"")}</div></td>
      <td>${esc(c.model.name.replace("MySolar ",""))}</td>
      <td class="mono">${fmt(r.installDate)}</td>
      <td>${pill(c)}${r.claims.length ? ' <span class="pill a">Open claim</span>' : ""}</td>
      <td><span class="pill ${r.channel==="direct"?"g":"n"}">${r.channel==="direct"?"Direct":"Dealer"}</span>
        ${r.dealer?`<div class="src">${esc(r.dealer)}</div>`:""}</td>
    </tr>`).join("")
    : `<tr><td colspan="6" class="empty">${counts.total===0
        ? "No installations registered yet.<br><span class='tiny'>Use “Register an installation” to add the first one.</span>"
        : "No records match those filters."}</td></tr>`;

  return `<div class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px">
      <h1>Warranty registry</h1>
      <a class="btn btn-p" href="#/admin/new">Register an installation</a>
    </div>
    <div class="stats">
      <div class="stat"><b>${counts.total}</b><span>Registered units</span></div>
      <div class="stat"><b style="color:var(--green)">${counts.guarantee}</b><span>Under guarantee</span></div>
      <div class="stat"><b style="color:var(--blue)">${counts.warranty}</b><span>Under tank warranty</span></div>
      <div class="stat"><b style="color:var(--amber)">${counts.openClaims}</b><span>Open claims</span></div>
    </div>
    <div class="toolbar">
      <div class="field grow"><label for="q">Search</label>
        <input id="q" placeholder="Name, warranty no, serial, phone, area, dealer" value="${esc(FILTER.q)}"></div>
      <div class="field"><label for="fs">Status</label>
        <select id="fs"><option value="all">All</option><option value="guarantee">Under guarantee</option>
        <option value="warranty">Under tank warranty</option><option value="expired">Expired</option></select></div>
      <div class="field"><label for="fc">Sold via</label>
        <select id="fc"><option value="all">All</option><option value="direct">Direct</option>
        <option value="dealer">Dealer</option></select></div>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Warranty no</th><th>Customer</th><th>Model</th><th>Installed</th><th>Status</th><th>Channel</th></tr></thead>
      <tbody id="tb">${body}</tbody></table></div>
    <p class="tiny muted" style="margin-top:12px">Showing ${shown.length} of ${counts.total}. Click any row to open the record.</p>
  </div>`;
}

async function viewDetail(id){
  const r = await DataSource.getById(id);
  if(!r) return `<div class="page"><div class="card empty">Record not found.</div></div>`;
  const c = coverage(r);
  const svc = r.service.length ? r.service.slice().reverse().map(s => `
    <div class="claim"><div style="display:flex;justify-content:space-between;gap:10px">
      <b>${esc(s.type)}</b><span class="src">${fmt(s.date)}</span></div>
      <div class="muted tiny">${esc(s.tech)} — ${esc(s.note)}</div></div>`).join("")
    : `<div class="claim muted tiny">No service visits recorded.</div>`;
  const claims = r.claims.length ? r.claims.slice().reverse().map(cl => `
    <div class="claim"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
      <b>${esc(cl.issue)}</b><span class="pill ${cl.status==="resolved"?"g":"a"}">${esc(cl.status)}</span></div>
      <div class="src" style="margin:3px 0">${fmt(cl.date)}</div>
      <div class="muted tiny">${esc(cl.resolution)}</div></div>`).join("")
    : `<div class="claim muted tiny">No claims raised.</div>`;

  return `<div class="page">
    <button class="crumb" onclick="location.hash='#/admin/list'">&larr; Back to registry</button>
    <div style="display:flex;justify-content:space-between;align-items:start;gap:14px;flex-wrap:wrap;margin-bottom:16px">
      <div><h1>${esc(r.name)}</h1>
        <div class="src">${esc(r.warrantyNo)}${r.serial?" · "+esc(r.serial):""}</div></div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">${pill(c)}
        <span class="pill ${r.channel==="direct"?"g":"n"}">${r.channel==="direct"?"Sold direct":"Via dealer"}</span></div>
    </div>
    <div class="detail-grid">
      <div style="display:flex;flex-direction:column;gap:18px">
        <div class="card"><div class="sec-h">Coverage</div>
          <div class="timeline" style="border-bottom:0">
            <div class="bar"><span class="g" style="width:${c.pctGuarantee}%"></span>
              <i style="width:${c.pctElapsed}%;opacity:.55"></i></div>
            <div class="barlbl"><span>${fmt(r.installDate)}</span><span>${fmt(c.wEnd)}</span></div></div>
          <dl class="kv" style="padding-top:6px">
            <dt>Model</dt><dd>${esc(c.model.name)}</dd>
            <dt>Capacity</dt><dd>${c.model.litres} L · ${c.model.gallons} gal · ${esc(c.model.pax)} pax</dd>
            <dt>Tank steel</dt><dd>${esc(c.model.steel)}</dd>
            <dt>Copper tubes / panel</dt><dd>${c.model.tubes} · ${esc(c.model.panel)}</dd>
            <dt>Installed</dt><dd>${fmt(r.installDate)}</dd>
            <dt>Guarantee ends (${c.model.guaranteeYears} yr)</dt><dd>${fmt(c.gEnd)}</dd>
            <dt>Tank warranty ends (${c.model.warrantyYears} yr)</dt><dd>${fmt(c.wEnd)}</dd>
          </dl></div>
        <div class="card"><div class="sec-h">Service history
          <button class="btn btn-s" style="padding:6px 12px;font-size:.85rem" id="addSvc">Log a visit</button></div>
          ${svc}</div>
        <div class="card"><div class="sec-h">Claims</div>${claims}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px">
        <div class="card"><div class="sec-h">Customer</div>
          <dl class="kv">
            <dt>Name</dt><dd>${esc(r.name)}</dd>
            <dt>Phone</dt><dd>${esc(r.phone)}</dd>
            <dt>Email</dt><dd style="word-break:break-all">${esc(r.email||"—")}</dd>
            <dt>Area</dt><dd>${esc(r.area||"—")}</dd></dl>
          <div class="card-pad" style="border-top:1px solid var(--line);padding-top:14px">
            <div class="tiny muted">Installation address</div>
            <div style="font-size:.92rem">${esc(r.address||"—")}</div></div>
          <div class="card-pad" style="border-top:1px solid var(--line)">
            <a class="btn btn-s btn-full" target="_blank" rel="noopener"
              href="https://wa.me/${waNumber(r.phone)}">WhatsApp customer</a></div>
        </div>
        <div class="card"><div class="sec-h">Origin</div>
          <dl class="kv">
            <dt>Channel</dt><dd>${r.channel==="direct"?"Direct":"Dealer"}</dd>
            <dt>Dealer</dt><dd>${esc(r.dealer||"—")}</dd>
            <dt>Installed by</dt><dd>${esc(r.installer||"—")}</dd></dl></div>
      </div>
    </div></div>`;
}

/* ---------- follow-ups ---------- */
/* One message per rule. Staff can edit before sending - the link opens
   WhatsApp with the text pre-filled, it does not send anything by itself. */
const WA_TEMPLATES = {
  post_install: r =>
    `Hi ${r.customer_name}, this is MySolar. Thank you for choosing us. Just checking in — is everything working well with your system? If you're happy with it, we'd really appreciate a Google review.`,
  service_due: r =>
    `Hi ${r.customer_name}, this is MySolar. Your solar water heater (${r.warranty_no}) is due for a service. Would you like us to arrange a visit? We'll clean the panel and check the whole system.`,
  guarantee_end: r =>
    `Hi ${r.customer_name}, this is MySolar. Your guarantee period is ending soon. Would you like us to do a check-up before it does?`,
  warranty_end: r =>
    `Hi ${r.customer_name}, this is MySolar. Your system was installed on ${fmt(r.install_date)} and the tank warranty runs to ${fmt(r.warranty_end)}. Happy to come and check its condition and talk through your options — no obligation.`,
  dormant: r =>
    `Hi ${r.customer_name}, this is MySolar. It's been a while since your last service. Regular servicing keeps the system running efficiently — would you like us to arrange a visit?`,
  claim_stale: r =>
    `Hi ${r.customer_name}, this is MySolar following up on the issue you reported. Sorry for the delay — we'd like to get this sorted for you. When would suit for a visit?`
};

const OUTCOMES = [
  ["contacted","Contacted"], ["booked","Booked a visit"], ["sold","Sold"],
  ["no_answer","No answer"], ["not_interested","Not interested"], ["wrong_number","Wrong number"]
];

let FU_FILTER = "all";

async function viewFollowups(){
  const rows = await DataSource.listFollowups();
  const shown = FU_FILTER === "all" ? rows : rows.filter(r => r.priority === FU_FILTER);

  const counts = {
    all: rows.length,
    high: rows.filter(r => r.priority === "high").length,
    overdue: rows.filter(r => r.days_overdue > 0).length
  };

  const body = shown.length ? shown.map(r => {
    const tpl = WA_TEMPLATES[r.rule_code] || (x => `Hi ${x.customer_name}, this is MySolar.`);
    const wa = `https://wa.me/${waNumber(r.customer_phone)}?text=${encodeURIComponent(tpl(r))}`;
    return `
    <div class="fu" data-fu="${r.id}">
      <div class="fu-main">
        <div>
          <span class="pill ${r.priority==="high"?"x":r.priority==="normal"?"w":"n"}">${esc(r.label)}</span>
          ${r.days_overdue > 0 ? `<span class="pill a">${r.days_overdue}d overdue</span>` : ""}
          <div class="fu-name">${esc(r.customer_name)}</div>
          <div class="src">${esc(r.customer_phone)} · ${esc(r.customer_area||"—")} · ${esc(r.warranty_no)} · ${esc(r.model_name.replace("MySolar ",""))}</div>
        </div>
        <div class="fu-acts">
          <a class="btn btn-p" style="padding:9px 14px;font-size:.87rem" target="_blank" rel="noopener" href="${wa}">WhatsApp</a>
          <button class="btn btn-s" style="padding:9px 14px;font-size:.87rem" data-act="done">Done</button>
          <button class="btn btn-s" style="padding:9px 14px;font-size:.87rem" data-act="snooze">Snooze</button>
          <button class="btn btn-s" style="padding:9px 14px;font-size:.87rem" data-act="open">Record</button>
        </div>
      </div>
      <div class="fu-panel" data-panel="done">
        <label>What happened?</label>
        <div class="fu-opts">${OUTCOMES.map(([v,l]) =>
          `<button class="btn btn-s" style="padding:8px 13px;font-size:.86rem" data-outcome="${v}">${l}</button>`).join("")}</div>
        <input data-note placeholder="Note (optional)" style="margin-top:10px">
      </div>
      <div class="fu-panel" data-panel="snooze">
        <label>Remind me again in</label>
        <div class="fu-opts">
          <button class="btn btn-s" style="padding:8px 13px;font-size:.86rem" data-snooze="7">1 week</button>
          <button class="btn btn-s" style="padding:8px 13px;font-size:.86rem" data-snooze="30">1 month</button>
          <button class="btn btn-s" style="padding:8px 13px;font-size:.86rem" data-snooze="90">3 months</button>
        </div>
      </div>
    </div>`;
  }).join("") : `<div class="card empty">${counts.all === 0
      ? "Nothing due right now.<br><span class='tiny'>Tap “Refresh list” to check for newly due follow-ups.</span>"
      : "No follow-ups match that filter."}</div>`;

  return `<div class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px">
      <h1>Follow-ups</h1>
      <button class="btn btn-s" id="fuGen">Refresh list</button>
    </div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><b>${counts.all}</b><span>To follow up</span></div>
      <div class="stat"><b style="color:var(--red)">${counts.high}</b><span>Priority</span></div>
      <div class="stat"><b style="color:var(--amber)">${counts.overdue}</b><span>Overdue</span></div>
    </div>
    <div class="toolbar">
      <div class="field"><label for="fup">Show</label>
        <select id="fup">
          <option value="all">Everything</option>
          <option value="high">Priority only</option>
          <option value="normal">Normal</option>
          <option value="low">Low</option>
        </select></div>
    </div>
    ${body}
  </div>`;
}

function wireFollowups(){
  const gen = $("#fuGen");
  if(gen) gen.onclick = async () => {
    gen.disabled = true; gen.textContent = "Checking…";
    try { await DataSource.generateFollowups(); } catch(e){ alert(e.message || e); }
    render();
  };
  const sel = $("#fup");
  if(sel){ sel.value = FU_FILTER; sel.onchange = () => { FU_FILTER = sel.value; render(); }; }

  document.querySelectorAll(".fu").forEach(card => {
    const id = card.dataset.fu;
    const panels = { done: card.querySelector('[data-panel="done"]'),
                     snooze: card.querySelector('[data-panel="snooze"]') };

    card.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      const target = (a === "open") ? "done" : a;
      if(a === "open" || a === "done" || a === "snooze"){
        const isOpen = panels[target].classList.contains("show");
        Object.values(panels).forEach(p => p.classList.remove("show"));
        if(!isOpen) panels[target].classList.add("show");
      }
    });

    card.querySelectorAll("[data-outcome]").forEach(b => b.onclick = async () => {
      const note = card.querySelector("[data-note]").value.trim();
      b.disabled = true;
      try { await DataSource.completeFollowup(id, b.dataset.outcome, note); render(); }
      catch(e){ alert(e.message || e); b.disabled = false; }
    });

    card.querySelectorAll("[data-snooze]").forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { await DataSource.snoozeFollowup(id, Number(b.dataset.snooze)); render(); }
      catch(e){ alert(e.message || e); b.disabled = false; }
    });
  });
}

/* ---------- render ---------- */
async function render(){
  nav();
  const r = route(), app = $("#app");

  if(r === "#/check" || r === "#/"){
    app.innerHTML = viewCheck();
    $("#lkGo").onclick = doLookup;
    ["wn","pn"].forEach(id => $("#"+id).addEventListener("keydown", e => { if(e.key==="Enter") doLookup(); }));
    return;
  }

  if(r.startsWith("#/admin")){
    if(!USER){
      app.innerHTML = viewLogin();
      const go = async () => {
        const btn = $("#loginGo");
        btn.disabled = true; btn.textContent = "Signing in…";
        const res = await DataSource.signIn($("#em").value.trim(), $("#pw").value);
        btn.disabled = false; btn.textContent = "Sign in";
        if(res.ok){ USER = res.user; FU_COUNT = await DataSource.countFollowups();
                    location.hash = "#/admin/list"; render(); }
        else $("#loginErr").innerHTML = `<div class="err">${esc(res.message)}</div>`;
      };
      $("#loginGo").onclick = go;
      $("#pw").addEventListener("keydown", e => { if(e.key==="Enter") go(); });
      return;
    }

    app.innerHTML = `<div class="spin">Loading…</div>`;
    try{
      if(r === "#/admin/followups"){
        app.innerHTML = await viewFollowups();
        wireFollowups();
        FU_COUNT = await DataSource.countFollowups();
        nav();
        return;
      }

      if(r === "#/admin/new"){
        app.innerHTML = viewNew();
        $("#nGo").onclick = async () => {
          const v = id => $("#"+id).value.trim();
          if(!v("n_name") || !v("n_phone") || !v("n_date")){
            $("#nErr").innerHTML = `<div class="err">Name, phone and install date are required.</div>`; return;
          }
          const btn = $("#nGo"); btn.disabled = true; btn.textContent = "Saving…";
          try{
            const row = await DataSource.createWarranty({
              name:v("n_name"), phone:v("n_phone"), email:v("n_email"), address:v("n_addr"),
              area:v("n_area"), installDate:v("n_date"), model:$("#n_model").value,
              serial:v("n_serial"), channel:$("#n_channel").value,
              dealer:v("n_dealer"), installer:v("n_installer")
            });
            location.hash = "#/admin/" + row.id;
          }catch(e){
            $("#nErr").innerHTML = `<div class="err">Couldn't save.<br><span class="tiny mono">${esc(e.message||e)}</span></div>`;
            btn.disabled = false; btn.textContent = "Register & generate warranty";
          }
        };
        return;
      }

      const m = r.match(/^#\/admin\/(\d+)$/);
      if(m){
        app.innerHTML = await viewDetail(m[1]);
        const btn = $("#addSvc");
        if(btn) btn.onclick = async () => {
          const note = prompt("What was done on this visit?");
          if(!note) return;
          await DataSource.addServiceVisit(m[1], {
            date:new Date().toISOString().slice(0,10), type:"Service visit",
            tech:USER?.email || "Staff", note
          });
          render();
        };
        return;
      }

      app.innerHTML = await viewList();
      const wire = () => {
        const refresh = async () => {
          FILTER.q = $("#q").value; FILTER.status = $("#fs").value; FILTER.channel = $("#fc").value;
          const pos = $("#q").selectionStart;
          app.innerHTML = await viewList();
          $("#fs").value = FILTER.status; $("#fc").value = FILTER.channel;
          $("#q").focus(); $("#q").setSelectionRange(pos,pos);
          wire();
        };
        $("#q").oninput = refresh; $("#fs").onchange = refresh; $("#fc").onchange = refresh;
        document.querySelectorAll("#tb tr[data-id]").forEach(tr =>
          tr.onclick = () => location.hash = "#/admin/" + tr.dataset.id);
      };
      $("#fs").value = FILTER.status; $("#fc").value = FILTER.channel;
      wire();
    }catch(e){
      app.innerHTML = `<div class="page"><div class="err">
        Couldn't load data from the database.<br>
        <span class="tiny mono">${esc(e.message||e)}</span><br><br>
        <span class="tiny">Check that both SQL files have been run, and that you're signed in.</span>
      </div></div>`;
    }
    return;
  }

  location.hash = "#/check";
}

(async function boot(){
  USER = await DataSource.currentUser();
  if(USER) FU_COUNT = await DataSource.countFollowups();
  render();
})();
</script>
</body>
