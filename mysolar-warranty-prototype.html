<style>
:root{
  --blue:#006C9C; --blue-deep:#004A6B; --blue-night:#0A2B38; --tint:#EDF4F8;
  --green:#0F7B4F; --green-bg:#E4F4EC;
  --amber:#9A6410; --amber-bg:#FCF0DC;
  --red:#A32A20;  --red-bg:#FBE9E7;
  --grey:#5A6B74; --line:#D8E2E7; --ink:#12242D; --paper:#fff; --bg:#F5F8FA;
  --sans:'Public Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2;font-weight:700;letter-spacing:-.015em}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1rem}
a{color:var(--blue)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}

.demoflag{background:var(--blue-night);color:#F0B429;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:7px}

/* shell */
.topnav{background:var(--blue-night);color:#fff}
.topnav .in{max-width:1240px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:700;font-size:1.06rem;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#7FB4C8;font-weight:500}
.navbtns{display:flex;gap:8px}
.navbtns a{color:#BBD8E4;text-decoration:none;font-size:.88rem;font-weight:600;padding:7px 13px;border-radius:4px}
.navbtns a:hover{background:rgba(255,255,255,.1);color:#fff}
.navbtns a.on{background:var(--blue);color:#fff}

.page{max-width:1240px;margin:0 auto;padding:26px 22px 60px}
.narrow{max-width:620px}

/* generic */
.card{background:var(--paper);border:1px solid var(--line);border-radius:7px}
.card-pad{padding:22px}
label{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);margin-bottom:6px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:5px;font-family:var(--mono);font-size:.94rem;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--blue);outline:none}
select{font-family:var(--sans)}
.field{margin-bottom:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.row2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:5px;padding:11px 20px;font-size:.93rem;font-weight:600;cursor:pointer;text-decoration:none;transition:.14s}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-deep)}
.btn-s{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--blue);color:var(--blue)}
.btn-full{width:100%}
.err{background:var(--red-bg);color:var(--red);border:1px solid #F0C7C2;border-radius:5px;padding:11px 13px;font-size:.9rem;margin-bottom:14px}
.muted{color:var(--grey)}
.tiny{font-size:.85rem}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:3px;white-space:nowrap}
.pill.g{background:var(--green-bg);color:var(--green)}
.pill.w{background:var(--tint);color:var(--blue-deep)}
.pill.x{background:var(--red-bg);color:var(--red)}
.pill.n{background:#EEF1F3;color:var(--grey)}
.pill.a{background:var(--amber-bg);color:var(--amber)}

/* customer view */
.hero-c{background:linear-gradient(155deg,var(--blue) 0%,var(--blue-deep) 100%);color:#fff;padding:40px 22px 46px}
.hero-c .in{max-width:620px;margin:0 auto}
.hero-c h1{font-size:1.85rem;color:#fff}
.hero-c p{color:#C4E0EC;margin:10px 0 0}
.lookup-card{max-width:620px;margin:-30px auto 0;position:relative}
.result-hd{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.result-hd .model{font-size:1.25rem;font-weight:700}
.timeline{padding:20px 22px;border-bottom:1px solid var(--line)}
.bar{height:9px;background:#E6ECEF;border-radius:99px;overflow:hidden;margin:9px 0 7px;position:relative}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar .g{position:absolute;top:0;left:0;height:100%;background:var(--green);border-radius:99px;opacity:.85}
.barlbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;color:var(--grey);letter-spacing:.06em}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;margin:0;padding:20px 22px}
dl.kv dt{color:var(--grey);font-size:.89rem}
dl.kv dd{margin:0;font-family:var(--mono);font-size:.89rem;text-align:right}
.svc{padding:18px 22px;border-top:1px solid var(--line)}
.svc-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.svc-item:last-child{border-bottom:0}
.svc-item .d{font-family:var(--mono);font-size:.82rem;color:var(--grey);white-space:nowrap;min-width:92px}

/* admin */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:780px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:15px 17px}
.stat b{display:block;font-size:1.7rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat span{font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;color:var(--grey)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.toolbar .field{margin:0}
.toolbar .grow{flex:1;min-width:210px}
table{width:100%;border-collapse:collapse;background:var(--paper)}
th{text-align:left;font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;color:var(--grey);font-weight:600;padding:11px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--tint)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
.src{font-family:var(--mono);font-size:.76rem;color:var(--grey)}
.empty{padding:44px 20px;text-align:center;color:var(--grey)}
.crumb{background:none;border:0;color:var(--blue);font-weight:600;font-size:.9rem;cursor:pointer;padding:0;margin-bottom:14px}
.detail-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr}}
.sec-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
.claim{padding:13px 18px;border-bottom:1px solid var(--line);font-size:.9rem}
.claim:last-child{border-bottom:0}

const DataSource = {
  _rows: SEED.map(r => ({...r})),

  async listWarranties(){
    return this._rows.map(r => ({...r}));
  },

  async getById(id){
    const r = this._rows.find(x => x.id === Number(id));
    return r ? {...r} : null;
  },

  /* Customer-facing lookup.
     Requires warranty number AND matching phone so a guessed number
     can't expose someone else's name, address and phone. */
  async findForCustomer(warrantyNo, phone){
    const key  = String(warrantyNo).trim().toUpperCase().replace(/\s+/g,"");
    const dial = digits(phone);
    const row = this._rows.find(r => r.warrantyNo.toUpperCase().replace(/\s+/g,"") === key);
    if(!row) return { ok:false, reason:"notfound" };
    if(dial.length < 4 || !digits(row.phone).endsWith(dial.slice(-8)) &&
       !digits(row.phone).endsWith(dial.slice(-4))) return { ok:false, reason:"mismatch" };
    return { ok:true, row:{...row} };
  },

  async createWarranty(payload){
    const id = Math.max(0, ...this._rows.map(r => r.id)) + 1;
    const yr = new Date(payload.installDate).getFullYear();
    const seq = String(600 + id).padStart(4,"0");
    const row = {
      id,
      warrantyNo: `MYS-${yr}-${seq}`,
      serial: payload.serial || `${payload.model.replace("-","")}-${String(yr).slice(2)}-${seq}`,
      model: payload.model, name: payload.name, phone: payload.phone,
      email: payload.email || "", address: payload.address || "", area: payload.area || "",
      installDate: payload.installDate,
      channel: payload.channel, dealer: payload.dealer || "",
      installer: payload.installer || "", service: [], claims: []
    };
    this._rows.push(row);
    return {...row};
  },

  async addServiceVisit(id, visit){
    const r = this._rows.find(x => x.id === Number(id));
    if(!r) return null;
    r.service.push(visit);
    r.service.sort((a,b) => a.date.localeCompare(b.date));
    return {...r};
  }
};
/* ==================== END OF DATA LAYER ==================== */


/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const digits = s => String(s||"").replace(/\D/g,"");
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function addYears(iso, n){
  const d = new Date(iso + "T00:00:00");
  d.setFullYear(d.getFullYear() + n);
  return d;
}
function fmt(d){
  const dt = (typeof d === "string") ? new Date(d + "T00:00:00") : d;
  return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

/* The single source of truth for warranty status. */
function coverage(row){
  const m = MODELS[row.model];
  const start = new Date(row.installDate + "T00:00:00");
  const gEnd  = addYears(row.installDate, m.guaranteeYears);
  const wEnd  = addYears(row.installDate, m.warrantyYears);
  const now   = new Date();
  let state, label, cls;
  if(now < gEnd){ state="guarantee"; label="Under guarantee"; cls="g"; }
  else if(now < wEnd){ state="warranty"; label="Under tank warranty"; cls="w"; }
  else { state="expired"; label="Expired"; cls="x"; }
  const total = daysBetween(start, wEnd);
  const gone  = Math.min(Math.max(daysBetween(start, now),0), total);
  return {
    state, label, cls, gEnd, wEnd, model:m,
    pctElapsed: Math.round(gone/total*100),
    pctGuarantee: Math.round(daysBetween(start,gEnd)/total*100),
    daysLeft: Math.max(daysBetween(now,wEnd),0)
  };
}
function pill(c){ return `<span class="pill ${c.cls}">${c.label}</span>`; }

async function doLookup(){
  const wn = $("#wn").value, pn = $("#pn").value;
  const box = $("#lkResult"), errBox = $("#lkErr");
  errBox.innerHTML = ""; box.innerHTML = "";
  if(!wn.trim() || !pn.trim()){
    errBox.innerHTML = `<div class="err">Please fill in both fields.</div>`; return;
  }
  const res = await DataSource.findForCustomer(wn, pn);
  if(!res.ok){
    errBox.innerHTML = `<div class="err">${res.reason === "notfound"
      ? "We couldn't find that warranty number. Please check it and try again."
      : "That phone number doesn't match this warranty. Please use the number given at installation."}</div>`;
    return;
  }
  box.innerHTML = customerCard(res.row);
}

function customerCard(row){
  const c = coverage(row);
  const svc = row.service.length
    ? row.service.slice().reverse().map(s =>
        `<div class="svc-item"><span class="d">${fmt(s.date)}</span><span>${esc(s.type)} — ${esc(s.note)}</span></div>`).join("")
    : `<p class="tiny muted" style="margin:0">No service visits recorded yet.</p>`;

  return `<div class="card">
    <div class="result-hd">
      <div>
        <div class="model">${esc(c.model.name)}</div>
        <div class="tiny muted mono">${esc(row.warrantyNo)}</div>
      </div>
      ${pill(c)}
    </div>

    <div class="timeline">
      <div class="tiny muted">Coverage from ${fmt(row.installDate)}</div>
      <div class="bar">
        <span class="g" style="width:${c.pctGuarantee}%"></span>
        <i style="width:${c.pctElapsed}%;opacity:.55"></i>
      </div>
      <div class="barlbl"><span>Installed</span><span>${c.state==="expired"
        ? "Warranty ended " + fmt(c.wEnd)
        : c.daysLeft + " days remaining"}</span></div>
    </div>

    <dl class="kv">
      <dt>Registered to</dt><dd>${esc(row.name)}</dd>
      <dt>Capacity</dt><dd>${c.model.litres} L · ${c.model.gallons} gal</dd>
      <dt>Serial number</dt><dd>${esc(row.serial)}</dd>
      <dt>Installed</dt><dd>${fmt(row.installDate)}</dd>
      <dt>Guarantee (${c.model.guaranteeYears} yr)</dt><dd>${fmt(c.gEnd)}</dd>
      <dt>Tank warranty (${c.model.warrantyYears} yr)</dt><dd>${fmt(c.wEnd)}</dd>
    </dl>

    <div class="svc">
      <h3 style="margin-bottom:9px">Service history</h3>
      ${svc}
    </div>

    <div class="card-pad" style="border-top:1px solid var(--line)">
      <a class="btn btn-p btn-full" target="_blank" rel="noopener"
         href="https://wa.me/60123180048?text=${encodeURIComponent("Hi MySolar, I'd like to ask about warranty "+row.warrantyNo+".")}">
        WhatsApp us about this system</a>
    </div>
  </div>`;
}

/* ---------- admin ---------- */
function viewLogin(){
  return `<div class="page narrow"><div class="card card-pad">
    <h2>Staff sign in</h2>
    <p class="tiny muted">Prototype only — real version uses proper accounts, one per staff member.</p>
    <div id="loginErr"></div>
    <div class="field"><label for="pw">Passcode</label><input id="pw" type="password" placeholder="mysolar"></div>
    <button class="btn btn-p btn-full" id="loginGo">Sign in</button>
    <p class="tiny muted" style="margin:12px 0 0">Demo passcode: <span class="mono">mysolar</span></p>
  </div></div>`;
}

let FILTER = { q:"", status:"all", channel:"all" };

async function viewList(){
  const rows = await DataSource.listWarranties();
  const withCov = rows.map(r => ({r, c:coverage(r)}));

  const counts = {
    total: withCov.length,
    guarantee: withCov.filter(x => x.c.state==="guarantee").length,
    warranty: withCov.filter(x => x.c.state==="warranty").length,
    expired: withCov.filter(x => x.c.state==="expired").length,
    openClaims: withCov.filter(x => x.r.claims.some(c => c.status==="open")).length
  };

  const q = FILTER.q.toLowerCase();
  const shown = withCov.filter(({r,c}) => {
    if(FILTER.status !== "all" && c.state !== FILTER.status) return false;
    if(FILTER.channel !== "all" && r.channel !== FILTER.channel) return false;
    if(!q) return true;
    return [r.warrantyNo,r.serial,r.name,r.phone,r.area,r.dealer].join(" ").toLowerCase().includes(q);
  }).sort((a,b) => b.r.installDate.localeCompare(a.r.installDate));

  const body = shown.length ? shown.map(({r,c}) => `
    <tr data-id="${r.id}">
      <td class="mono">${esc(r.warrantyNo)}</td>
      <td><b>${esc(r.name)}</b><div class="src">${esc(r.area)}</div></td>
      <td>${esc(c.model.name.replace("MySolar ",""))}</td>
      <td class="mono">${fmt(r.installDate)}</td>
      <td>${pill(c)}${r.claims.some(x=>x.status==="open") ? ' <span class="pill a">Open claim</span>' : ""}</td>
      <td><span class="pill ${r.channel==="direct"?"g":"n"}">${r.channel==="direct"?"Direct":"Dealer"}</span>
          ${r.dealer ? `<div class="src">${esc(r.dealer)}</div>` : ""}</td>
    </tr>`).join("") : `<tr><td colspan="6" class="empty">No records match those filters.</td></tr>`;

  return `<div class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px">
      <h1>Warranty registry</h1>
      <a class="btn btn-p" href="#/admin/new">Register an installation</a>
    </div>

    <div class="stats">
      <div class="stat"><b>${counts.total}</b><span>Registered units</span></div>
      <div class="stat"><b style="color:var(--green)">${counts.guarantee}</b><span>Under guarantee</span></div>
      <div class="stat"><b style="color:var(--blue)">${counts.warranty}</b><span>Under tank warranty</span></div>
      <div class="stat"><b style="color:var(--amber)">${counts.openClaims}</b><span>Open claims</span></div>
    </div>

    <div class="toolbar">
      <div class="field grow">
        <label for="q">Search</label>
        <input id="q" placeholder="Name, warranty no, serial, phone, area, dealer" value="${esc(FILTER.q)}">
      </div>
      <div class="field">
        <label for="fs">Status</label>
        <select id="fs">
          <option value="all">All</option>
          <option value="guarantee">Under guarantee</option>
          <option value="warranty">Under tank warranty</option>
          <option value="expired">Expired</option>
        </select>
      </div>
      <div class="field">
        <label for="fc">Sold via</label>
        <select id="fc">
          <option value="all">All</option>
          <option value="direct">Direct</option>
          <option value="dealer">Dealer</option>
        </select>
      </div>
    </div>

    <div class="tablewrap"><table>
      <thead><tr><th>Warranty no</th><th>Customer</th><th>Model</th><th>Installed</th><th>Status</th><th>Channel</th></tr></thead>
      <tbody id="tb">${body}</tbody>
    </table></div>
    <p class="tiny muted" style="margin-top:12px">Showing ${shown.length} of ${counts.total}. Click any row to open the record.</p>
  </div>`;
}

async function viewDetail(id){
  const r = await DataSource.getById(id);
  if(!r) return `<div class="page"><div class="card empty">Record not found.</div></div>`;
  const c = coverage(r);

  const svc = r.service.length ? r.service.slice().reverse().map(s => `
    <div class="claim"><div style="display:flex;justify-content:space-between;gap:10px">
      <b>${esc(s.type)}</b><span class="src">${fmt(s.date)}</span></div>
      <div class="muted tiny">${esc(s.tech)} — ${esc(s.note)}</div></div>`).join("")
    : `<div class="claim muted tiny">No service visits recorded.</div>`;

  const claims = r.claims.length ? r.claims.slice().reverse().map(cl => `
    <div class="claim"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
      <b>${esc(cl.issue)}</b>
      <span class="pill ${cl.status==="open"?"a":"g"}">${cl.status}</span></div>
      <div class="src" style="margin:3px 0">${fmt(cl.date)}</div>
      <div class="muted tiny">${esc(cl.resolution)}</div></div>`).join("")
    : `<div class="claim muted tiny">No claims raised.</div>`;

  return `<div class="page">
    <button class="crumb" onclick="location.hash='#/admin/list'">&larr; Back to registry</button>
    <div style="display:flex;justify-content:space-between;align-items:start;gap:14px;flex-wrap:wrap;margin-bottom:16px">
      <div>
        <h1>${esc(r.name)}</h1>
        <div class="src">${esc(r.warrantyNo)} · ${esc(r.serial)}</div>
      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">${pill(c)}
        <span class="pill ${r.channel==="direct"?"g":"n"}">${r.channel==="direct"?"Sold direct":"Via dealer"}</span></div>
    </div>

    <div class="detail-grid">
      <div style="display:flex;flex-direction:column;gap:18px">
        <div class="card">
          <div class="sec-h">Coverage</div>
          <div class="timeline" style="border-bottom:0">
            <div class="bar">
              <span class="g" style="width:${c.pctGuarantee}%"></span>
              <i style="width:${c.pctElapsed}%;opacity:.55"></i>
            </div>
            <div class="barlbl"><span>${fmt(r.installDate)}</span><span>${fmt(c.wEnd)}</span></div>
          </div>
          <dl class="kv" style="padding-top:6px">
            <dt>Model</dt><dd>${esc(c.model.name)}</dd>
            <dt>Capacity</dt><dd>${c.model.litres} L · ${c.model.gallons} gal · ${esc(c.model.pax)} pax</dd>
            <dt>Tank steel</dt><dd>${esc(c.model.steel)}</dd>
            <dt>Copper tubes / panel</dt><dd>${c.model.tubes} · ${esc(c.model.panel)}</dd>
            <dt>Installed</dt><dd>${fmt(r.installDate)}</dd>
            <dt>Guarantee ends (${c.model.guaranteeYears} yr)</dt><dd>${fmt(c.gEnd)}</dd>
            <dt>Tank warranty ends (${c.model.warrantyYears} yr)</dt><dd>${fmt(c.wEnd)}</dd>
          </dl>
        </div>

        <div class="card">
          <div class="sec-h">Service history
            <button class="btn btn-s" style="padding:6px 12px;font-size:.85rem" id="addSvc">Log a visit</button></div>
          ${svc}
        </div>

        <div class="card"><div class="sec-h">Claims</div>${claims}</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:18px">
        <div class="card">
          <div class="sec-h">Customer</div>
          <dl class="kv">
            <dt>Name</dt><dd>${esc(r.name)}</dd>
            <dt>Phone</dt><dd>${esc(r.phone)}</dd>
            <dt>Email</dt><dd style="word-break:break-all">${esc(r.email||"—")}</dd>
            <dt>Area</dt><dd>${esc(r.area)}</dd>
          </dl>
          <div class="card-pad" style="border-top:1px solid var(--line);padding-top:14px">
            <div class="tiny muted">Installation address</div>
            <div style="font-size:.92rem">${esc(r.address)}</div>
          </div>
          <div class="card-pad" style="border-top:1px solid var(--line)">
            <a class="btn btn-s btn-full" target="_blank" rel="noopener"
               href="https://wa.me/6${digits(r.phone).replace(/^0/,"")}">WhatsApp customer</a>
          </div>
        </div>

        <div class="card">
          <div class="sec-h">Origin</div>
          <dl class="kv">
            <dt>Channel</dt><dd>${r.channel==="direct"?"Direct":"Dealer"}</dd>
            <dt>Dealer</dt><dd>${esc(r.dealer||"—")}</dd>
            <dt>Installed by</dt><dd>${esc(r.installer||"—")}</dd>
          </dl>
        </div>
      </div>
    </div>
  </div>`;
}

function viewNew(){
  const opts = Object.entries(MODELS)
    .map(([k,m]) => `<option value="${k}">${m.name} — ${m.gallons} gal</option>`).join("");
  return `<div class="page narrow">
    <button class="crumb" onclick="location.hash='#/admin/list'">&larr; Back to registry</button>
    <div class="card card-pad">
      <h2>Register an installation</h2>
      <p class="tiny muted">Filled in by the install team on site. Warranty number is generated automatically.</p>
      <div id="nErr"></div>
      <div class="field"><label for="n_name">Customer name</label><input id="n_name"></div>
      <div class="row2">
        <div class="field"><label for="n_phone">Phone</label><input id="n_phone" placeholder="012-345 6789"></div>
        <div class="field"><label for="n_email">Email (optional)</label><input id="n_email"></div>
      </div>
      <div class="field"><label for="n_addr">Installation address</label><input id="n_addr"></div>
      <div class="row2">
        <div class="field"><label for="n_area">Area</label><input id="n_area" placeholder="Puchong"></div>
        <div class="field"><label for="n_date">Install date</label><input id="n_date" type="date"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="n_model">Model</label><select id="n_model">${opts}</select></div>
        <div class="field"><label for="n_serial">Serial number</label><input id="n_serial" placeholder="Auto if blank"></div>

        <div class="field"><label for="n_dealer">Dealer name</label><input id="n_dealer" placeholder="Leave blank if direct"></div>

/* ---------- render ---------- */
async function render(){
  nav();
  const r = route();
  const app = $("#app");

  if(r === "#/check" || r === "#/"){
    app.innerHTML = viewCheck();
    $("#lkGo").onclick = doLookup;
    ["wn","pn"].forEach(id => $("#"+id).addEventListener("keydown", e => { if(e.key==="Enter") doLookup(); }));
    return;
  }

  if(r.startsWith("#/admin")){
    if(!SESSION){
      app.innerHTML = viewLogin();
      const go = () => {
        if($("#pw").value === "mysolar"){ SESSION = true; location.hash = "#/admin/list"; render(); }
        else $("#loginErr").innerHTML = `<div class="err">Incorrect passcode.</div>`;
      };
      $("#loginGo").onclick = go;
      $("#pw").addEventListener("keydown", e => { if(e.key==="Enter") go(); });
      return;
    }

    if(r === "#/admin/new"){
      app.innerHTML = viewNew();
      $("#nGo").onclick = async () => {
        const v = id => $("#"+id).value.trim();
        if(!v("n_name") || !v("n_phone") || !v("n_date")){
          $("#nErr").innerHTML = `<div class="err">Name, phone and install date are required.</div>`; return;
        }
        const row = await DataSource.createWarranty({
          name:v("n_name"), phone:v("n_phone"), email:v("n_email"), address:v("n_addr"),
          area:v("n_area"), installDate:v("n_date"), model:$("#n_model").value,
          serial:v("n_serial"), channel:$("#n_channel").value, dealer:v("n_dealer"),
          installer:v("n_installer")
        });
        location.hash = "#/admin/" + row.id;
      };
      return;
    }

    const m = r.match(/^#\/admin\/(\d+)$/);
    if(m){
      app.innerHTML = await viewDetail(m[1]);
      const btn = $("#addSvc");
      if(btn) btn.onclick = async () => {
        const note = prompt("What was done on this visit?");
        if(!note) return;
        await DataSource.addServiceVisit(m[1], {
          date:new Date().toISOString().slice(0,10), type:"Service visit", tech:"Staff", note
        });
        render();
      };
      return;
    }

    app.innerHTML = await viewList();
    $("#fs").value = FILTER.status;
    $("#fc").value = FILTER.channel;
    const refresh = async () => {
      FILTER.q = $("#q").value; FILTER.status = $("#fs").value; FILTER.channel = $("#fc").value;
      const pos = $("#q").selectionStart;
      app.innerHTML = await viewList();
      $("#fs").value = FILTER.status; $("#fc").value = FILTER.channel;
      $("#q").focus(); $("#q").setSelectionRange(pos,pos);
      wireList();
    };
    const wireList = () => {
      $("#q").oninput = refresh; $("#fs").onchange = refresh; $("#fc").onchange = refresh;
      document.querySelectorAll("#tb tr[data-id]").forEach(tr =>
        tr.onclick = () => location.hash = "#/admin/" + tr.dataset.id);
    };
    wireList();
    return;
  }

  location.hash = "#/check";
}

render();
</script>
